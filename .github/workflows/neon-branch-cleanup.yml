# Delete the Neon database branch when a PR is closed (merged or abandoned).
# This keeps the Neon project tidy and avoids unnecessary branch costs.

name: Delete Neon Branch

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  neon-branch-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview/pr-${{ github.event.pull_request.number }}
