# Vercel Preview Deployment with Neon Branch Database
#
# Creates an isolated Neon database branch for each PR, runs migrations,
# and deploys a Vercel preview with the branch DATABASE_URL.
#
# Required secrets:
#   NEON_API_KEY       - Neon API key for branch management
#   NEON_PROJECT_ID    - Neon project ID
#   VERCEL_TOKEN       - Vercel personal access token
#   VERCEL_ORG_ID      - Vercel organization/team ID
#   VERCEL_PROJECT_ID  - Vercel project ID

name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_BRANCH_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Neon Branch Database ---

      - name: Create Neon database branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          # Parent defaults to the project's default branch (main)

      # --- Install Dependencies & Migrate ---

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}

      # --- Vercel Deployment ---

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} \
            --env DATABASE_URL="${{ steps.neon.outputs.db_url_pooled }}")
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # --- PR Comment ---

      - name: Comment on PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Preview Deployment',
              '',
              `**Preview URL:** ${{ steps.deploy.outputs.url }}`,
              `**Neon Branch:** \`${{ env.NEON_BRANCH_NAME }}\``,
              '',
              '_This preview has its own isolated database. It will be cleaned up when the PR is closed._',
            ].join('\n');

            // Update existing comment if one exists, otherwise create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Preview Deployment';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
